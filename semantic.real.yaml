# 真实公开数据：Olist 订单（诊断报告）+ RetailRocket 行为日志（漏斗）。
# 两者不是同一家公司，不能互相换算。Olist 没有目标、客流和库存，这些指标不显示。
name: Olist × RetailRocket 真实公开数据
data_note: 订单数据来自 Olist 巴西电商公开数据集（CC BY-NC-SA 4.0，2017-01 至 2018-08），金额单位为巴西雷亚尔。门店对应卖家所在州，品牌对应卖家。
currency: "R$"
calendar:
  fiscal_year_start_month: 1
  ly_shift_days: 364
defaults:
  channel: 跨州
  focus: sales
branding:
  name: ReportAgent
  product: ChatBI
  primary: "#000000"
  primary_text: "#ffffff"
  accent: "#c8102e"
labels:
  store: 卖家州
  category: 品类
  subcategory: 子类
  family: 卖家
  item: 商品
  channel: 配送范围
  subchannel: 买家大区
sources:
  sales:
    table: warehouse.fact_sales
    date: biz_date
    store: store_id
    channel: channel
    subchannel: subchannel
    category: category
    subcategory: subcategory
    family: brand
    item: item_id
    sales: net_sales
    qty: qty
    ticket: order_id
  items:
    table: warehouse.dim_item
    item: item_id
    name: item_name
    exclude_flag: is_new
  stores:
    table: warehouse.dim_store
    store: store_id
    name: store_name
    peer_group: peer_group
    region: region
    city: city
  funnel:
    table: warehouse.fact_funnel
    date: biz_date
    user: visitor_id
    event: event
    note: 行为数据来自 RetailRocket 公开数据集（2015 年 5 至 9 月，线上看板保留最后约 12 周，ID 已脱敏），与订单报告不是同一家公司。各步骤为同周期去重访客之比，不是同一用户的顺序路径。
    steps:
      - {name: 浏览, value: view}
      - {name: 加购, value: addtocart}
      - {name: 成交, value: transaction}
    dimensions:
      category_l1: 一级品类
      category_l2: 二级品类
      category_id: 叶子品类
      item_id: 商品
synonyms:
  美妆: 美妆个护
  个护: 美妆个护
  护肤: 美妆个护
  家居: 家居家具
  数码: 家电数码
  圣保罗: SP
glossary:
  - "Sales：销售金额。AB：客单价，Sales / Trans。AI：客件数，Qty / Trans。Trans：成交单数。"
  - "vs LY：与去年同期之比，100 表示持平。这份数据的订单在 2018 年增长很快，指数普遍较高。"
  - "门店指卖家所在州，品牌指卖家，渠道指配送范围（同州或跨州）。"
constraints:
  - "不要建议调整价格；可以建议优化商品结构、卖家运营或配送。"
banned_phrases:
  - 调整定价
  - 优化定价
  - 降价
examples:
  - {type: 基础统计, text: 上周各品类的销售额和同比}
  - {type: 基础统计, text: 上周各卖家州的客单价和客件数}
  - {type: TOP-N 分析, text: 上周美妆个护销售额最高的 10 个子类}
  - {type: TOP-N 分析, text: 上周同比下滑最多的 5 个子类}
  - {type: 情况概览, text: 圣保罗州美妆个护上周为什么涨了}
  - {type: 情况概览, text: 帮我出一份圣保罗州美妆个护的周报}
  - {type: 趋势分析, text: 近 12 周东南区销售额趋势}
  - {type: 漏斗分析, text: 看一下最新一周的浏览到成交漏斗}
  - {type: 漏斗分析, text: 哪些品类加购多但成交转化低}
verified_questions:
  - question: 上周各品类销售额和同比
    tool: query_metrics
    args: {metrics: [sales, sales_vs_ly], dimensions: [category]}
  - question: 上周销售额最高的 10 个子类
    tool: query_metrics
    args: {metrics: [sales, qty], dimensions: [subcategory], order_by: sales, limit: 10}
  - question: 近 12 周东南区销售趋势
    tool: query_metrics
    args: {metrics: [sales], dimensions: [week], filters: {region: 东南}, last_weeks: 12}
  - question: 圣保罗州美妆个护上周为什么涨或跌
    tool: explain_change
    args: {store: SP, category: 美妆个护}
  - question: 帮我出一份圣保罗州美妆个护的周报
    tool: generate_report
    args: {store: SP, category: 美妆个护}
  - question: 看一下最新一周的漏斗
    tool: funnel_analysis
    args: {}
  - question: 按品类看漏斗转化
    tool: funnel_analysis
    args: {dimension: category_l1}
