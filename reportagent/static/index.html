<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReportAgent</title>
<style>
:root {
  --navy:#172f57; --navy-2:#23457a; --rose:#f6b6cc; --accent:#b8325f; --accent-soft:#fde8ef; --blue:#1d4f91; --blue-soft:#e4e9f5;
  --ink:#27272a; --muted:#71717a; --faint:#a1a1aa; --line:#e7e7ea; --bg:#f5f5f5; --surface:#fff;
  --good:#1f7a3f; --good-bg:#e4f5e9; --run:#1d4f91; --run-bg:#e4edfb; --bad:#c02626; --bad-bg:#fde8e8; --wait:#71717a; --wait-bg:#f0f0f2;
}
* { box-sizing:border-box; }
html,body { height:100%; margin:0; }
body { background:var(--bg); color:var(--ink); font:14px/1.6 -apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",Arial,sans-serif; display:flex; flex-direction:column; overflow:hidden; }
button,input,select,textarea { font:inherit; color:inherit; }
button { cursor:pointer; background:none; border:0; padding:0; }
:focus-visible { outline:2px solid var(--blue); outline-offset:2px; }
.top { height:56px; flex:none; background:var(--navy); color:#fff; display:flex; align-items:center; gap:14px; padding:0 20px; }
.top .brand { font-weight:700; font-size:18px; color:var(--rose); letter-spacing:.24em; }
.badge { font-size:11px; font-weight:600; border:1px solid currentColor; border-radius:6px; padding:1px 8px; white-space:nowrap; }
.top .src { margin-left:auto; font-size:12px; opacity:.85; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.icon-btn { width:32px; height:32px; display:grid; place-items:center; border-radius:8px; }
.icon-btn:hover { background:rgba(127,127,127,.15); }
.shell { flex:1; min-height:0; display:flex; }
.side { width:276px; flex:none; padding:16px 14px; display:flex; flex-direction:column; gap:12px; min-height:0; }
.side.closed { display:none; }
.side-head { display:flex; align-items:center; gap:8px; }
.logo { width:36px; height:36px; flex:none; }
.side-head b { font-size:15px; }
.tip { font-size:11px; line-height:1.4; color:var(--muted); background:#fff; border-radius:10px; padding:6px 10px; }
.new-chat { background:var(--blue-soft); color:var(--blue); font-weight:600; height:40px; border-radius:12px; text-align:left; padding:0 14px; }
.new-chat:hover { background:#d9e0f1; }
.history { flex:1; overflow-y:auto; min-height:0; scrollbar-width:none; }
.history:hover { scrollbar-width:thin; }
.group-head { display:flex; justify-content:space-between; width:100%; padding:8px 4px 6px; font-size:13px; }
.group-head i { font-style:normal; font-size:10px; transition:transform .15s; }
.group.closed .group-head i { transform:rotate(-90deg); }
.group.closed .items { display:none; }
.conv { position:relative; border-radius:10px; padding:8px 28px 8px 10px; font-size:12px; color:var(--muted); cursor:pointer; line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; margin-bottom:2px; }
.conv:hover { background:#ececee; }
.conv.active { background:#fff; color:var(--ink); }
.conv .more { position:absolute; top:6px; right:6px; width:20px; height:20px; border-radius:6px; display:none; color:var(--muted); }
.conv:hover .more, .conv .more:focus-visible { display:block; }
.conv .more:hover { background:#dcdce0; }
.conv input { width:100%; border:1px solid var(--blue); border-radius:6px; padding:2px 6px; font-size:12px; }
.menu { position:fixed; background:#fff; border-radius:10px; box-shadow:0 6px 24px rgba(0,0,0,.16); padding:4px; z-index:30; min-width:110px; }
.menu button { display:block; width:100%; text-align:left; padding:6px 10px; border-radius:6px; font-size:13px; }
.menu button:hover { background:var(--bg); }
.menu .danger { color:var(--bad); }
.empty-history { color:var(--faint); font-size:12px; padding:20px 4px; text-align:center; }
.main { flex:1; min-width:0; padding:14px 14px 14px 0; display:flex; gap:12px; }
.panel { flex:1; min-width:0; background:var(--surface); border-radius:16px; display:flex; flex-direction:column; }
.scroll { flex:1; overflow-y:auto; padding:24px 28px 12px; scrollbar-width:thin; scrollbar-color:transparent transparent; }
.scroll:hover { scrollbar-color:#d4d4d8 transparent; }
.thread { max-width:860px; margin:0 auto; }
.hello { display:flex; align-items:center; gap:16px; margin:16px 0 26px; }
.hello .logo { width:58px; height:58px; }
.hello h1 { font-size:18px; line-height:1.5; margin:0; font-weight:600; }
.try { display:flex; justify-content:space-between; color:var(--muted); font-size:13px; margin-bottom:10px; }
.try button { color:var(--blue); font-weight:500; }
.cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; }
.card { text-align:left; border-radius:14px; padding:14px; min-height:112px; background:linear-gradient(170deg,#f5f7fc,#fff 70%); box-shadow:0 2px 10px rgba(23,47,87,.07); border:1px solid transparent; }
.card:hover { border-color:var(--blue); }
.card b { display:block; font-size:13px; margin-bottom:8px; }
.card span { font-size:12px; color:#52525b; line-height:1.55; }
.report-entry { margin-top:18px; display:flex; align-items:center; justify-content:space-between; gap:12px; background:var(--accent-soft); border-radius:14px; padding:14px 16px; }
.report-entry .ghost { background:#fff; }
.report-entry b { display:block; font-size:14px; }
.report-entry span { font-size:12px; color:var(--muted); }
.primary { background:var(--accent); color:#fff; border-radius:10px; padding:7px 16px; font-weight:600; white-space:nowrap; }
.primary:hover { filter:brightness(.88); }
.primary:disabled { opacity:.55; cursor:default; }
.msg-user { display:flex; justify-content:flex-end; margin:18px 0; }
.msg-user div { background:#f0f0f2; border-radius:14px; padding:6px 14px; max-width:78%; white-space:pre-wrap; }
.msg-bot { display:flex; gap:12px; margin:14px 0; }
.msg-bot .logo { width:30px; height:30px; }
.bot-body { flex:1; min-width:0; }
.step-head { color:var(--muted); font-size:12px; display:flex; gap:6px; align-items:center; min-height:30px; flex-wrap:wrap; }
.link { color:var(--blue); font-size:12px; }
.thought { border-left:2px solid var(--line); padding:2px 0 2px 12px; font-size:12px; color:#52525b; white-space:pre-wrap; margin:0 0 10px; }
.dots { display:inline-flex; gap:3px; align-items:center; height:14px; }
.dots i { width:5px; height:5px; border-radius:50%; background:var(--accent); animation:bounce 1s infinite; }
.dots i:nth-child(2) { animation-delay:.15s; } .dots i:nth-child(3) { animation-delay:.3s; }
@keyframes bounce { 0%,60%,100% { transform:translateY(0); opacity:.5; } 30% { transform:translateY(-4px); opacity:1; } }
@media (prefers-reduced-motion:reduce) { .dots i { animation:none; } }
.tasks { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:8px; margin:0 0 12px; }
.task { background:#f7f7f9; border-radius:10px; padding:10px 12px; font-size:12px; }
.task .h { display:flex; align-items:center; gap:6px; font-weight:600; margin-bottom:4px; }
.pill { font-weight:500; font-size:11px; padding:0 7px; border-radius:9px; }
.pill.running { color:var(--run); background:var(--run-bg); }
.pill.done { color:var(--good); background:var(--good-bg); }
.pill.failed { color:var(--bad); background:var(--bad-bg); }
.pill.retry { color:#92580b; background:#fdf1dc; }
.task p { margin:0 0 8px; color:#52525b; line-height:1.45; word-break:break-word; }
.bar { height:6px; background:#e4e4e7; border-radius:3px; overflow:hidden; }
.bar i { display:block; height:100%; background:var(--blue); border-radius:3px; transition:width .3s; }
.task.failed .bar i { background:var(--faint); }
.answer { margin:4px 0 10px; white-space:pre-wrap; }
.result { border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin:10px 0; }
.result h4 { margin:0 0 8px; font-size:13px; font-weight:600; }
.table-wrap { overflow-x:auto; max-height:340px; overflow-y:auto; }
table { border-collapse:collapse; width:100%; font-size:12.5px; white-space:nowrap; }
th { position:sticky; top:0; background:#fafafa; text-align:right; padding:5px 10px; font-weight:600; border-bottom:1px solid var(--line); }
td { text-align:right; padding:4px 10px; border-bottom:1px solid #f2f2f4; font-variant-numeric:tabular-nums; }
th.txt, td.txt { text-align:left; }
.chart { margin:4px 0 10px; }
.chart svg { display:block; width:100%; height:auto; }
.chart .hit:hover + .tip-v, .chart .hit:hover ~ .tip-v { opacity:1; }
.meta { margin-top:8px; font-size:12px; color:var(--muted); }
.meta summary { cursor:pointer; color:var(--blue); }
.meta pre { white-space:pre-wrap; word-break:break-all; background:#fafafa; padding:8px; font-size:11px; max-height:200px; overflow:auto; }
.assume { color:var(--muted); font-size:12px; }
.warn { color:#92580b; font-size:12px; margin:6px 0; }
.report-card { display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--accent-soft); border-radius:12px; padding:10px 14px; margin:10px 0; }
.report-card b { font-size:13px; }
.chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
.chip { border:1px solid var(--line); border-radius:14px; padding:3px 12px; font-size:12px; color:#3f3f46; }
.chip:hover { border-color:var(--blue); color:var(--blue); }
.fb { display:flex; gap:4px; margin-top:6px; align-items:center; color:var(--muted); font-size:12px; }
.fb button { width:26px; height:26px; border-radius:6px; }
.fb button:hover, .fb button.on { background:var(--bg); }
.err { color:var(--bad); }
.composer { padding:8px 28px 12px; }
.composer-in { max-width:860px; margin:0 auto; }
.box { border-radius:20px; box-shadow:0 2px 14px rgba(0,0,0,.09); padding:10px 14px 8px; background:#fff; }
.box textarea { width:100%; border:0; resize:none; outline:0; background:none; height:24px; max-height:120px; display:block; }
.box-row { display:flex; align-items:center; gap:12px; margin-top:6px; font-size:12px; color:var(--muted); }
.switch { display:inline-flex; align-items:center; gap:6px; }
.switch i { width:28px; height:16px; border-radius:8px; background:#d4d4d8; position:relative; transition:background .15s; }
.switch i::after { content:""; position:absolute; width:12px; height:12px; top:2px; left:2px; background:#fff; border-radius:50%; transition:left .15s; }
.switch[aria-checked=true] i { background:var(--blue); }
.switch[aria-checked=true] i::after { left:14px; }
.send { margin-left:auto; width:30px; height:30px; border-radius:50%; background:var(--blue); color:#fff; display:grid; place-items:center; }
.send:disabled { background:#d4d4d8; cursor:default; }
.disclaimer { text-align:left; font-size:11px; color:var(--faint); margin:6px 0 0 14px; }
.canvas { width:50%; min-width:380px; flex:none; background:#fff; border-radius:16px; display:flex; flex-direction:column; overflow:hidden; }
.canvas[hidden], .modal[hidden] { display:none; }
.canvas-head { display:flex; align-items:center; gap:8px; padding:10px 14px; border-bottom:1px solid var(--line); }
.canvas-head b { font-size:13px; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ghost { border:1px solid var(--line); border-radius:8px; padding:3px 10px; font-size:12px; white-space:nowrap; }
.ghost:hover { border-color:var(--blue); color:var(--blue); }
.canvas iframe { flex:1; border:0; width:100%; }
.ask-sel { position:fixed; z-index:20; background:var(--navy); color:#fff; border-radius:8px; padding:3px 12px; font-size:12px; box-shadow:0 4px 14px rgba(0,0,0,.2); }
.modal { position:fixed; inset:0; background:rgba(0,0,0,.35); display:grid; place-items:center; z-index:40; padding:16px; }
.dialog { background:#fff; border-radius:16px; padding:20px 22px; width:420px; max-width:100%; }
.dialog h3 { margin:0 0 4px; font-size:16px; }
.dialog p { margin:0 0 14px; font-size:12px; color:var(--muted); }
.field { display:block; margin-bottom:10px; font-size:12px; color:var(--muted); }
.field select,.field input { display:block; width:100%; margin-top:3px; height:36px; border:1px solid var(--line); border-radius:8px; padding:0 8px; background:#fff; color:var(--ink); font-size:14px; }
.row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.dialog-foot { display:flex; justify-content:flex-end; gap:8px; margin-top:8px; align-items:center; }
.form-err { color:var(--bad); font-size:12px; flex:1; }
@media (max-width:1000px) {
  .canvas { position:fixed; inset:56px 0 0 0; width:auto; min-width:0; z-index:15; border-radius:0; }
  .main { padding:8px; }
  .side { position:fixed; top:56px; bottom:0; left:0; z-index:16; background:var(--bg); box-shadow:2px 0 12px rgba(0,0,0,.12); }
  .scroll,.composer { padding-left:14px; padding-right:14px; }
  .badge { font-size:11px; font-weight:600; border:1px solid currentColor; border-radius:6px; padding:1px 8px; white-space:nowrap; }
.top .src { display:none; }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><symbol id="logo" viewBox="0 0 40 40"><rect width="40" height="40" rx="12" style="fill:var(--navy)"/><rect x="10" y="20" width="5" height="10" rx="2" style="fill:var(--rose)"/><rect x="17.5" y="14" width="5" height="16" rx="2" style="fill:var(--rose)"/><rect x="25" y="9" width="5" height="21" rx="2" style="fill:var(--rose)"/></symbol></svg>
<header class="top">
  <button class="icon-btn" id="toggleSide" aria-label="收起或展开会话列表"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M2 4h14M2 9h14M2 14h14"/></svg></button>
  <div class="brand" id="brand">ReportAgent</div><span class="badge" id="synthetic" hidden>模拟数据</span>
  <div class="src" id="src"></div>
</header>
<div class="shell">
  <aside class="side" id="side">
    <div class="side-head"><svg class="logo"><use href="#logo"/></svg><b id="product">ChatBI</b><div class="tip" id="tip">可以查询销售和漏斗数据，也可以直接出报告</div></div>
    <button class="new-chat" id="newChat">新建会话</button>
    <nav class="history" id="history" aria-label="历史会话"></nav>
  </aside>
  <main class="main">
    <section class="panel">
      <div class="scroll" id="scroll"><div class="thread" id="thread"></div></div>
      <div class="composer"><div class="composer-in">
        <div class="box">
          <textarea id="input" rows="1" placeholder="问问数据，或者让我生成周报、看漏斗" aria-label="输入问题"></textarea>
          <div class="box-row">
            <button class="switch" id="assist" role="switch" aria-checked="true" title="开启后先拆解问题再取数，适合模糊问题"><i></i>辅助思考</button>
            <button class="ghost" id="openReport">生成报告</button><button class="ghost" id="openFunnel" hidden>漏斗分析</button>
            <button class="send" id="send" aria-label="发送" disabled></button>
          </div>
        </div>
        <div class="disclaimer">AI 可能出错，请核对重要信息。表格里的数字由代码计算。</div>
      </div></div>
    </section>
    <section class="canvas" id="canvas" hidden aria-label="报告画布">
      <div class="canvas-head"><b id="canvasTitle"></b><a class="ghost" id="pdf" target="_blank" rel="noopener">下载 PDF</a><a class="ghost" id="openTab" target="_blank" rel="noopener">新窗口</a><button class="icon-btn" id="closeCanvas" aria-label="关闭报告">✕</button></div>
      <iframe id="frame" title="业绩报告" sandbox="allow-same-origin allow-forms"></iframe>
    </section>
  </main>
</div>
<div class="modal" id="modal" hidden><form class="dialog" id="reportForm">
  <h3>生成业绩报告</h3><p>选好范围就能出报告，不经过对话。</p>
  <div class="row"><label class="field">门店<select id="fStore"></select></label><label class="field">品类<select id="fCategory"></select></label></div>
  <div class="row"><label class="field">周次（ISO）<input id="fWeek" pattern="\d{6}" required></label><label class="field">下钻渠道<select id="fChannel"></select></label></div>
  <label class="field">分析指标<select id="fFocus"><option value="sales">Sales 销售额</option><option value="qty">Qty 销量</option></select></label>
  <div class="dialog-foot"><span class="form-err" id="formErr" role="alert"></span><button type="button" class="ghost" id="cancelReport">取消</button><button class="primary" id="submitReport">生成</button></div>
</form></div>
<script>
const $ = id => document.getElementById(id);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') n.className = v; else if (k === 'text') n.textContent = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v); else if (v !== undefined && v !== null) n.setAttribute(k, v);
  }
  for (const c of kids) if (c) n.append(c);
  return n;
};
const svgLogo = cls => { const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('class', cls); const u = document.createElementNS('http://www.w3.org/2000/svg', 'use'); u.setAttribute('href', '#logo'); s.append(u); return s; };
const ARROW = '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 12V2M3 6l4-4 4 4"/></svg>';
const STOP = '<svg width="12" height="12" viewBox="0 0 12 12"><rect width="12" height="12" rx="2" fill="#fff"/></svg>';
const state = { meta: null, cid: null, busy: false, controller: null, examplePage: 0, conversations: [] };
const scroller = $('scroll'), thread = $('thread');
const atBottom = () => scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 160;
const toBottom = (force) => { if (force || atBottom()) scroller.scrollTop = scroller.scrollHeight; };
async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) { let d = {}; try { d = await r.json(); } catch {} throw new Error(d.detail || `请求失败（${r.status}）`); }
  return r.json();
}

// ---------- history ----------
async function loadHistory() {
  state.conversations = await api('/api/conversations');
  const box = $('history'); box.textContent = '';
  if (!state.conversations.length) { box.append(el('div', { class: 'empty-history', text: '还没有会话' })); return; }
  const now = Date.now() / 1000, day = 86400;
  const groups = [['最近 7 天', c => now - c.updated < 7 * day], ['最近 30 天', c => now - c.updated >= 7 * day && now - c.updated < 30 * day], ['更久', c => now - c.updated >= 30 * day]];
  for (const [title, test] of groups) {
    const list = state.conversations.filter(test);
    if (!list.length) continue;
    const group = el('div', { class: 'group' });
    group.append(el('button', { class: 'group-head', onclick: () => group.classList.toggle('closed') }, el('span', { text: title }), el('i', { text: '▼' })));
    const items = el('div', { class: 'items' });
    for (const c of list) items.append(convItem(c));
    group.append(items); box.append(group);
  }
}
function convItem(c) {
  const row = el('div', { class: 'conv' + (c.id === state.cid ? ' active' : ''), tabindex: 0, role: 'button', onclick: () => openConversation(c.id), onkeydown: e => { if (e.key === 'Enter' && e.target === row) openConversation(c.id); } });
  row.append(document.createTextNode(c.title));
  row.append(el('button', { class: 'more', 'aria-label': '更多操作', text: '⋯', onclick: e => { e.stopPropagation(); showMenu(e, c, row); } }));
  return row;
}
function closeMenu() { document.querySelector('.menu')?.remove(); }
function showMenu(e, c, row) {
  closeMenu();
  const menu = el('div', { class: 'menu', style: `left:${e.clientX}px;top:${e.clientY + 8}px` });
  menu.append(el('button', { text: '重命名', onclick: () => { closeMenu(); renameInline(c, row); } }));
  menu.append(el('button', { class: 'danger', text: '删除', onclick: () => { menu.textContent = ''; menu.append(el('button', { class: 'danger', text: '确认删除？', onclick: async () => { closeMenu(); await api(`/api/conversations/${c.id}`, { method: 'DELETE' }); if (state.cid === c.id) newChat(); await loadHistory(); } }), el('button', { text: '取消', onclick: closeMenu })); } }));
  document.body.append(menu);
  setTimeout(() => document.addEventListener('click', ev => { if (!menu.contains(ev.target)) closeMenu(); }, { once: true }));
}
function renameInline(c, row) {
  const input = el('input', { value: c.title, 'aria-label': '会话名称', onclick: e => e.stopPropagation() });
  row.textContent = ''; row.append(input); input.select();
  const save = async () => { await api(`/api/conversations/${c.id}`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ title: input.value }) }); loadHistory(); };
  input.addEventListener('blur', save, { once: true });
  input.addEventListener('keydown', e => { if (e.key === 'Enter') input.blur(); if (e.key === 'Escape') { input.value = c.title; input.blur(); } });
}

// ---------- welcome ----------
function welcome() {
  thread.textContent = '';
  const hello = el('div', { class: 'hello' }, svgLogo('logo'), el('h1', {}, el('div', { text: '你好，我是你的零售数据助手。' }), el('div', { text: '今天想看点什么？' })));
  const cards = el('div', { class: 'cards' });
  const drawCards = () => {
    cards.textContent = '';
    const ex = state.meta.examples, types = [...new Set(ex.map(e => e.type))];
    for (const t of types) {
      const pool = ex.filter(e => e.type === t), item = pool[state.examplePage % pool.length];

// ---------- rendering ----------
function addUser(text) { thread.append(el('div', { class: 'msg-user' }, el('div', { text }))); toBottom(true); }

  $('frame').src = `/reports/${meta.id}`; $('pdf').href = `/reports/${meta.id}/pdf`; $('openTab').href = `/reports/${meta.id}`;

function showFunnel(url = '/funnel', title = '漏斗分析') {

function closeCanvas() { $('canvas').hidden = true; $('frame').removeAttribute('src'); hideAsk(); }

$('frame').addEventListener('load', () => {

// ---------- chat ----------
function setBusy(b) { state.busy = b; const s = $('send'); s.innerHTML = b ? STOP : ARROW; s.setAttribute('aria-label', b ? '停止' : '发送'); updateSend(); }

async function ask(text) {
