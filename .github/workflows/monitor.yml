name: monitor

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  readyz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        url: ["https://reportagent-api.onrender.com", "https://reportagent.vercel.app"]
    steps:
      - name: Check the site and its databases
        run: curl --fail --silent --show-error --max-time 120 --retry 2 --retry-delay 20 --retry-all-errors "${{ matrix.url }}/readyz"
